name: Sync Notion to Git

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Notion to MD Parser and Axios
        run: npm install @notionhq/client notion-to-md axios

      - name: Create Sync Script
        run: |
          cat << 'EOF' > sync.js
          const { Client } = require('@notionhq/client');
          const { NotionToMarkdown } = require('notion-to-md');
          const fs = require('fs');
          const path = require('path');
          const axios = require('axios');
          const { pipeline } = require('stream/promises');

          const notion = new Client({
            auth: process.env.NOTION_TOKEN
          });

          const n2m = new NotionToMarkdown({
            notionClient: notion
          });

          let imageCounter = 0;

          async function downloadImage(url, dest) {
            const response = await axios({
              url,
              responseType: 'stream',
              timeout: 60000
            });

            await pipeline(
              response.data,
              fs.createWriteStream(dest)
            );
          }

          async function handleMediaBlock(block) {
            const type = block.type;
            const media = block[type];
            const imageUrl = media?.file?.url || media?.external?.url;

            if (!imageUrl) {
              throw new Error(`No download URL for ${type} block ${block.id}`);
            }

            imageCounter++;
            const imageName = `image_${imageCounter}_${Date.now()}.png`;

            // Where the downloaded file is saved in the repository.
            const localPath = path.join('notes/images', imageName);

            // Where the browser must request it on your GitHub Pages site.
            const imagePathForWebsite = `/Gen-AI/notes/images/${imageName}`;

            console.log(`Downloading media item ${imageCounter}...`);

            try {
              await downloadImage(imageUrl, localPath);
            } catch (err) {
              throw new Error(
                `Failed to download ${type} block ${block.id}: ${err.message}`
              );
            }

            if (type === 'file') {
              return `[Download attachment](${imagePathForWebsite})`;
            }

            return `![image](${imagePathForWebsite})`;
          }

          async function run() {
            if (!process.env.NOTION_TOKEN) {
              throw new Error('NOTION_TOKEN secret is missing');
            }

            const url = process.env.NOTION_PAGE_URL || '';
            const matches = url.match(/[a-f0-9]{32}/i);

            if (!matches) {
              throw new Error('Could not parse a valid Notion Page ID from the URL');
            }

            const pageId = matches[0];

            fs.mkdirSync('notes/images', { recursive: true });

            n2m.setCustomTransformer('image', handleMediaBlock);
            n2m.setCustomTransformer('file', handleMediaBlock);

            const mdblocks = await n2m.pageToMarkdown(pageId);
            const mdString = n2m.toMarkdownString(mdblocks);

            fs.writeFileSync(
              'notes/my-synced-notes.md',
              mdString.parent,
              'utf8'
            );

            console.log('Successfully synced notes and downloaded assets!');
          }

          run().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          EOF

      - name: Download Notes and Images from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_URL: 'https://app.notion.com/p/Gen-AI-404e2f63c65e80529e57d8883c1bf485'
        run: node sync.js

      - name: Commit and Push to Repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update notes and assets from Notion"
            git push
          fi
