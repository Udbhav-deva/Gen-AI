name: Sync Notion to Git
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  push:
    paths:
      - "**/+notion.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: batuhan/notion-sync-action@v1
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
