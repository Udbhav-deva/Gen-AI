name: Sync Notion to Git
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to run it manually at any time

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Notion to MD Parser and Axios
        run: npm install @notionhq/client notion-to-md axios

      - name: Create Sync Script
        run: |
          cat << 'EOF' > sync.js
          const { Client } = require('@notionhq/client');
          const { NotionToMarkdown } = require('notion-to-md');
          const fs = require('fs');
          const path = require('path');
          const axios = require('axios');

          const notion = new Client({ auth: process.env.NOTION_TOKEN });
          const n2m = new NotionToMarkdown({ notionClient: notion });

          let imageCounter = 0;

          async function downloadImage(url, dest) {
            const response = await axios({ url, responseType: 'stream' });
            return new Promise((resolve, reject) => {
              response.data.pipe(fs.createWriteStream(dest))
                .on('finish', () => resolve())
                .on('error', e => reject(e));
            });
          }

          async function handleMediaBlock(block) {
            try {
              const type = block.type;
              const imageUrl = block[type]?.file?.url || block[type]?.external?.url;
              if (!imageUrl) return '';

              imageCounter++;
              const imageName = `image_${imageCounter}_${Date.now()}.png`;
              const localPath = path.join('notes/images', imageName);
              const relativePathForMarkdown = path.join('images', imageName);

              console.log(`Downloading media item ${imageCounter}...`);
              await downloadImage(imageUrl, localPath);

              return `![image](${relativePathForMarkdown})`;
            } catch (imgErr) {
              console.error('Failed to download media block:', imgErr.message);
              return '![image-failed-to-load]()';
            }
          }

          async function run() {
            try {
              const url = process.env.NOTION_PAGE_URL;
              const matches = url.match(/[a-f0-9]{32}/);
              if (!matches) throw new Error('Could not parse a valid Notion Page ID from the URL');
              const pageId = matches[0];
              
              if (!fs.existsSync('notes')) fs.mkdirSync('notes');
              if (!fs.existsSync('notes/images')) fs.mkdirSync('notes/images', { recursive: true });

              n2m.setCustomTransformer('image', handleMediaBlock);
              n2m.setCustomTransformer('file', handleMediaBlock);

              const mdblocks = await n2m.pageToMarkdown(pageId);
              const mdString = n2m.toMarkdownString(mdblocks);
              
              fs.writeFileSync('notes/my-synced-notes.md', mdString.parent);
              console.log('Successfully downloaded Notion page, images, and file attachments!');
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          run();
          EOF

      - name: Download Notes and Images from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_URL: 'https://notion.com'
        run: node sync.js

      - name: Commit and Push to Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@://github.com'
          git add notes/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update notes and all assets from Notion" && git push)
