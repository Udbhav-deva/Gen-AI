name: Sync Notion to Git

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @notionhq/client notion-to-md axios

      - name: Create sync script
        run: |
          cat << 'EOF' > sync.cjs
          const { Client } = require('@notionhq/client');
          const { NotionToMarkdown } = require('notion-to-md');
          const fs = require('fs');
          const path = require('path');
          const axios = require('axios');
          const { pipeline } = require('node:stream/promises');

          const notion = new Client({
            auth: process.env.NOTION_TOKEN
          });

          const n2m = new NotionToMarkdown({
            notionClient: notion
          });

          const siteUrl = 'https://udbhav-deva.github.io/Gen-AI';
          let mediaCounter = 0;

          async function handleMediaBlock(block) {
            const media = block[block.type];
            const url = media?.file?.url || media?.external?.url;

            if (!url) {
              throw new Error(`Missing media URL for block ${block.id}`);
            }

            mediaCounter++;
            console.log(`Downloading media item ${mediaCounter}...`);

            const response = await axios.get(url, {
              responseType: 'stream',
              timeout: 60000
            });

            // Preserve the actual file format rather than naming every file PNG.
            const contentType = String(
              response.headers['content-type'] || ''
            ).split(';')[0].trim().toLowerCase();

            const extensions = {
              'image/png': '.png',
              'image/jpeg': '.jpg',
              'image/gif': '.gif',
              'image/webp': '.webp',
              'image/svg+xml': '.svg',
              'image/avif': '.avif',
              'image/bmp': '.bmp',
              'image/tiff': '.tiff',
              'application/pdf': '.pdf'
            };

            const urlExtension = path.extname(new URL(url).pathname);
            const safeExtension = /^\.[a-z0-9]{1,10}$/i.test(urlExtension)
              ? urlExtension
              : '.bin';

            const extension = extensions[contentType] || safeExtension;
            const filename = `${block.id}${extension}`;
            const destination = path.join('notes', 'images', filename);

            await pipeline(
              response.data,
              fs.createWriteStream(destination)
            );

            // Full HTTPS URLs bypass Docsify's relative-path rewriting.
            const publicUrl = `${siteUrl}/notes/images/${filename}`;

            if (block.type === 'image') {
              return `![image](${publicUrl})`;
            }

            return `[Download attachment](${publicUrl})`;
          }

          async function run() {
            if (!process.env.NOTION_TOKEN) {
              throw new Error('The NOTION_TOKEN repository secret is missing.');
            }

            const pageUrl = process.env.NOTION_PAGE_URL || '';
            const match = pageUrl.match(/[a-f0-9]{32}/i);

            if (!match) {
              throw new Error('Could not extract the Notion page ID.');
            }

            fs.mkdirSync('notes/images', { recursive: true });

            n2m.setCustomTransformer('image', handleMediaBlock);
            n2m.setCustomTransformer('file', handleMediaBlock);

            const blocks = await n2m.pageToMarkdown(match[0]);
            const markdown = n2m.toMarkdownString(blocks);

            if (typeof markdown.parent !== 'string') {
              throw new Error('Notion conversion did not return Markdown.');
            }

            fs.writeFileSync(
              'notes/my-synced-notes.md',
              markdown.parent,
              'utf8'
            );

            console.log(`Notes synced successfully with ${mediaCounter} media items.`);
          }

          run().catch(error => {
            console.error(`Sync failed: ${error.message}`);
            process.exitCode = 1;
          });
          EOF

      - name: Download notes and images
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_URL: 'https://app.notion.com/p/Gen-AI-404e2f63c65e80529e57d8883c1bf485'
        run: node sync.cjs

      - name: Commit and push notes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add notes/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Notion notes and images"
            git push
          fi
